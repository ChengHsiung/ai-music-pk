name: Test and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      # The single-file build, downloadable from the run page and usable offline.
      - uses: actions/upload-artifact@v4
        with:
          name: ai-music-pk-offline
          path: dist/index.html
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request' && vars.DEPLOY_PAGES == 'true'
        with:
          path: dist

  # GitHub Pages needs a public repo (or a paid plan). Turn it on by setting the
  # repository variable DEPLOY_PAGES=true after enabling Pages with source "GitHub Actions".
  deploy:
    if: github.event_name != 'pull_request' && vars.DEPLOY_PAGES == 'true'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
